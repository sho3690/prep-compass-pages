<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Sakiyomi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<meta name="theme-color" content="#FAFAFB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1117" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sakiyomi">
<meta name="description" content="予定の先を先に読んで、準備の提案を出すAI秘書">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
</head>
<body>
<style>
:root{
  --bg:#FAFAFB; --surface:#FFFFFF; --surface-2:#F1F2F6; --tint:#EEF0FF; --tint-2:#F5F3FF;
  --ink:#1E293B; --ink-2:#334155; --ink-3:#5B6B82; --hair:#94A3B8;
  --line:#E6E8EF; --line-2:#D5D9E3;
  --primary:#4F46E5; --primary-ink:#FFFFFF; --accent:#6366F1; --focus:#6366F1;
  --violet:#6D28D9; --violet-soft:#A78BFA; --violet-bg:#F3F0FF;
  --teal:#0F766E; --teal-soft:#14B8A6; --teal-bg:#CCFBF1;
  --rose:#BE123C; --rose-soft:#FB7185; --rose-bg:#FFE4E6;
  --amber:#B45309; --amber-soft:#F59E0B; --amber-bg:#FEF3C7;
  --blue:#4338CA; --blue-bg:#E0E7FF;
  --green:#0F766E; --green-bg:#CCFBF1;
  --shadow:0 1px 2px rgba(30,41,59,.04), 0 6px 20px rgba(30,41,59,.06);
  --ring-track:#E6E8EF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1117; --surface:#171A23; --surface-2:#1F2330; --tint:#1E2142; --tint-2:#241F3D;
    --ink:#E5E7EB; --ink-2:#CBD5E1; --ink-3:#98A4B8; --hair:#4B5563;
    --line:#262B38; --line-2:#343B4B;
    --primary:#A5B4FC; --primary-ink:#0F1117; --accent:#818CF8; --focus:#818CF8;
    --violet:#C4B5FD; --violet-soft:#A78BFA; --violet-bg:#2A2350;
    --teal:#5EEAD4; --teal-soft:#2DD4BF; --teal-bg:#0F2E2B;
    --rose:#FDA4AF; --rose-soft:#FB7185; --rose-bg:#3B1222;
    --amber:#FCD34D; --amber-soft:#F59E0B; --amber-bg:#3B2A0F;
    --blue:#A5B4FC; --blue-bg:#1E2142;
    --green:#5EEAD4; --green-bg:#0F2E2B;
    --shadow:0 1px 2px rgba(0,0,0,.4); --ring-track:#262B38;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1117; --surface:#171A23; --surface-2:#1F2330; --tint:#1E2142; --tint-2:#241F3D;
  --ink:#E5E7EB; --ink-2:#CBD5E1; --ink-3:#98A4B8; --hair:#4B5563;
  --line:#262B38; --line-2:#343B4B;
  --primary:#A5B4FC; --primary-ink:#0F1117; --accent:#818CF8; --focus:#818CF8;
  --violet:#C4B5FD; --violet-soft:#A78BFA; --violet-bg:#2A2350;
  --teal:#5EEAD4; --teal-soft:#2DD4BF; --teal-bg:#0F2E2B;
  --rose:#FDA4AF; --rose-soft:#FB7185; --rose-bg:#3B1222;
  --amber:#FCD34D; --amber-soft:#F59E0B; --amber-bg:#3B2A0F;
  --blue:#A5B4FC; --blue-bg:#1E2142;
  --green:#5EEAD4; --green-bg:#0F2E2B;
  --shadow:0 1px 2px rgba(0,0,0,.4); --ring-track:#262B38;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink-2);
  font:16px/1.6 "Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",system-ui,sans-serif;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; overflow:hidden;
}
h1,h2,h3{color:var(--ink); margin:0}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

.app{height:100vh; height:100dvh; display:flex; flex-direction:column; max-width:520px; margin:0 auto; position:relative; background:var(--bg); overflow:hidden}
.hdr{flex:none; display:flex; align-items:center; justify-content:space-between; padding:calc(10px + env(safe-area-inset-top)) 18px 6px}
.brand{display:flex; align-items:center; gap:8px; font-weight:700; color:var(--ink); font-size:1.05rem}
.brand svg{width:26px; height:26px; color:var(--accent)}
.hdr-actions{display:flex; gap:8px}
.icon-btn{width:40px; height:40px; border-radius:50%; border:0; background:var(--surface); display:grid; place-items:center; color:var(--primary); box-shadow:var(--shadow)}
.icon-btn svg{width:20px; height:20px}
.icon-btn[disabled]{opacity:.5; cursor:default}
.icon-btn.is-spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .icon-btn.is-spin svg{animation:none} }
main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain}
.page{padding:6px 18px 40px}

/* ---------- あいさつ・AI秘書 ---------- */
.eyebrow{font-size:.78rem; color:var(--ink-3); font-weight:500; margin:0}
.greet h1{font-size:1.5rem; line-height:1.35; font-weight:700; letter-spacing:-.01em; margin:2px 0 12px; display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.greet h1 .wx{width:26px; height:26px; color:var(--amber-soft)}
.assistant{display:flex; gap:10px; align-items:flex-start}
.avatar{width:44px; height:44px; flex:none; border-radius:50%; box-shadow:0 6px 16px rgba(99,102,241,.25)}
.avatar svg{width:44px; height:44px; display:block}
.bubble{flex:1; min-width:0; background:var(--surface); border-radius:4px 18px 18px 18px; padding:12px 14px; box-shadow:var(--shadow); display:flex; gap:12px; align-items:center}
.bubble p{margin:0; font-size:.9rem; line-height:1.55; color:var(--ink-2); flex:1}
.mini-score{flex:none; position:relative; width:48px; height:48px}
.mini-score svg{width:48px; height:48px; transform:rotate(-90deg)}
.mini-score .track{fill:none; stroke:var(--ring-track); stroke-width:5}
.mini-score .bar{fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round}
.mini-score[data-tone="low"] .bar{stroke:var(--rose-soft)}
.mini-score[data-tone="warn"] .bar{stroke:var(--amber-soft)}
.mini-score[data-tone="good"] .bar{stroke:var(--teal-soft)}
.mini-score b{position:absolute; inset:0; display:grid; place-items:center; font-size:.72rem; font-weight:700; color:var(--ink)}
.status{display:inline-flex; align-items:center; gap:8px; font-size:.8rem; color:var(--ink-3); background:none; border:0; padding:10px 0 0; text-align:left}
.status .dot{width:8px; height:8px; border-radius:50%; background:var(--teal-soft); flex:none}
.status[data-state="demo"] .dot{background:var(--amber-soft)}
.status[data-state="error"] .dot{background:var(--rose-soft)}
.status[data-state="loading"] .dot{background:var(--hair)}
.status .chev{width:14px; height:14px}
.notice{border-radius:16px; padding:14px 16px; margin:12px 0 0; font-size:.9rem; background:var(--surface); box-shadow:var(--shadow); border:1px solid transparent}
.notice.err{border-color:var(--rose-soft); background:var(--rose-bg)}
.notice.warn{border-color:var(--amber-soft); background:var(--amber-bg)}
.notice h3{font-size:.95rem; display:flex; align-items:center; gap:8px; margin:0 0 4px}
.notice h3 svg{width:18px; height:18px; flex:none}
.notice p{margin:0; color:var(--ink-2)}
.notice .actions{margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.notice input[type="password"], .notice input[type="text"]{flex:1; min-width:140px; padding:10px 14px; min-height:44px; font-size:16px; border:1px solid var(--line-2); border-radius:999px; background:var(--surface); color:var(--ink)}

.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px}
.tile{background:var(--surface); border:0; border-radius:16px; padding:10px 8px; text-align:left; box-shadow:var(--shadow); color:var(--ink); min-height:72px; display:flex; flex-direction:column; justify-content:space-between; gap:4px; min-width:0}
.tile .lbl{font-size:.7rem; color:var(--ink-3); font-weight:500; line-height:1.3}
.tile b{font-size:1.35rem; font-weight:700; line-height:1.1}
.tile b small{font-size:.8rem; font-weight:500; margin-left:2px}
.tile.is-on{background:var(--primary); color:var(--primary-ink)}
.tile.is-on .lbl{color:var(--primary-ink); opacity:.85}

/* ---------- セクション共通 ---------- */
.sec{margin-top:26px}
.sec-h{display:flex; align-items:baseline; gap:10px; margin-bottom:10px}
.sec-h h2{font-size:1.1rem; font-weight:700}
.sec-h .range{font-size:.75rem; color:var(--ink-3); flex:1; min-width:0}
.card{background:var(--surface); border-radius:18px; box-shadow:var(--shadow)}
.empty{color:var(--ink-3); font-size:.9rem; margin:0; padding:14px 16px}

.badge{font-size:.7rem; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap; line-height:1.3}
.badge.prep{color:var(--rose); background:var(--rose-bg)}
.badge.check{color:var(--amber); background:var(--amber-bg)}
.badge.easy{color:var(--teal); background:var(--teal-bg)}
.badge.done{color:var(--blue); background:var(--blue-bg)}
.badge.done::before{content:"✓ "}
.chip{font-size:.7rem; font-weight:500; padding:4px 10px; border-radius:999px; background:var(--surface-2); color:var(--ink-2); white-space:nowrap}
.bar{width:4px; border-radius:4px; background:var(--hair); flex:none; align-self:stretch}
.bar.prep{background:var(--rose-soft)} .bar.check{background:var(--amber-soft)} .bar.easy{background:var(--teal-soft)} .bar.done{background:var(--accent)}
.dcol{flex:none; width:50px}
.dcol b{display:block; font-size:1rem; color:var(--ink); line-height:1.2}
.dcol span{display:block; font-size:.72rem; color:var(--ink-3); line-height:1.3}
.dcol.is-sat b{color:var(--accent)} .dcol.is-sun b, .dcol.is-hol b{color:var(--rose)}
.tcol{flex:1; min-width:0}
.tcol b{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:.98rem; color:var(--ink); line-height:1.35}
.tcol .loc{display:flex; align-items:center; gap:4px; font-size:.78rem; color:var(--ink-3); margin-top:2px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.tcol .loc svg{width:13px; height:13px; flex:none}
.tcol .bd{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}

/* ---------- 注目予定 ---------- */
.frow{display:flex; gap:12px; align-items:stretch; width:100%; text-align:left; background:var(--surface); border:0; border-radius:16px; padding:12px; box-shadow:var(--shadow); color:inherit; margin-bottom:10px}
.frow > svg.chev{width:18px; height:18px; color:var(--hair); align-self:center; flex:none}

/* ---------- 要準備のタスク ---------- */
.task{background:var(--surface); border-radius:18px; box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden}
.task-h{display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:none; border:0; padding:14px 14px 8px; color:inherit}
.due{flex:none; font-size:.7rem; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--surface-2); color:var(--ink-2)}
.due.soon{background:var(--rose-bg); color:var(--rose)}
.cl{padding:0 14px 12px}
.cli{display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:12px; background:var(--surface-2); margin-top:6px; cursor:pointer}
.cli input{width:22px; height:22px; accent-color:var(--primary); margin:0; flex:none}
.cli span{font-size:.9rem; color:var(--ink); flex:1; min-width:0}
.cli.is-done span{color:var(--ink-3); text-decoration:line-through}
.more{display:flex; align-items:center; justify-content:center; gap:4px; width:100%; background:none; border:0; color:var(--primary); font-size:.82rem; font-weight:600; padding:8px 0 2px; min-height:36px}
.more svg{width:16px; height:16px}

.seg{display:flex; background:var(--surface-2); border-radius:999px; padding:4px; gap:4px; margin-bottom:12px}
.seg button{flex:1; border:0; background:none; border-radius:999px; min-height:38px; font-weight:600; color:var(--ink-2); font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--primary); color:var(--primary-ink)}

/* ---------- 提案の一覧 ---------- */
.sug{list-style:none; margin:0; padding:0 14px 10px}
.sug li{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line)}
.sug li:first-child{border-top:0}
.sug .ic{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:none}
.sug .ic svg{width:16px; height:16px}
.sug b{display:block; font-size:.9rem; font-weight:600; color:var(--ink); line-height:1.4}
.sug small{display:block; font-size:.76rem; color:var(--ink-3); margin-top:1px}
.sug .mo{padding:0; border-top:0}
.sug .sgrow{display:flex; gap:10px; align-items:center; width:100%; cursor:pointer; min-width:0}
.sug .tx{flex:1; min-width:0}
.sug input{width:22px; height:22px; accent-color:var(--primary); margin:0; flex:none}
.sug li.is-going{opacity:.25; transition:opacity .2s}
.sug-foot{display:flex; justify-content:space-between; align-items:center; padding:2px 14px 10px; font-size:.78rem; color:var(--ink-3)}
.sug-foot button{background:none; border:0; color:var(--primary); font-weight:600; font-size:.8rem; padding:6px 8px; min-height:32px}
.finished .rrow .btn{margin-left:auto}
.finished .rrow span{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tile .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; background:var(--hair)}
.tile .dot.prep{background:var(--rose-soft)} .tile .dot.check{background:var(--amber-soft)}

/* ---------- 週の見出し・ヒント ---------- */
.wk-h{display:flex; align-items:baseline; gap:8px; margin:18px 0 8px; font-size:.82rem; font-weight:700; color:var(--ink-2)}
.wk-h span{font-weight:500; color:var(--ink-3); font-size:.75rem}
.hint{display:flex; gap:6px; align-items:flex-start; margin:0 14px 10px; padding:8px 10px; border-radius:10px; background:var(--violet-bg); color:var(--ink-2); font-size:.8rem; line-height:1.45}
.hint svg{width:15px; height:15px; flex:none; color:var(--violet); margin-top:2px}
.routine-box{background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:0 14px; margin-bottom:12px}
details.routine > summary{list-style:none; display:flex; align-items:center; gap:10px; padding:12px 0; cursor:pointer; font-size:.85rem; color:var(--ink-2)}
details.routine > summary::-webkit-details-marker{display:none}
details.routine > summary .n{flex:1}
details.routine > summary svg{width:16px; height:16px; color:var(--hair); transition:transform .2s}
details.routine[open] > summary svg{transform:rotate(90deg)}
details.routine .rrow{display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:.85rem; color:var(--ink-2)}
details.routine .rrow b{font-weight:600; color:var(--ink); width:52px; flex:none}
.brief{background:var(--surface); border-radius:18px; box-shadow:var(--shadow); padding:6px 16px; margin-top:12px}
.brief .b{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line); font-size:.88rem; color:var(--ink-2); line-height:1.5}
.brief .b:first-child{border-top:0}
.brief .b .ic{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:none}
.brief .b .ic svg{width:16px; height:16px}

/* ---------- AIアシスタント ---------- */
.ai-intro{display:flex; gap:10px; align-items:center; background:var(--tint); border-radius:18px; padding:12px 14px}
.ai-intro p{margin:0; font-size:.85rem; color:var(--ink-2)}
.ai-intro b{display:block; font-size:.8rem; color:var(--primary)}
.ai-card{background:var(--surface); border-radius:18px; box-shadow:var(--shadow); padding:14px 16px; margin-top:12px}
.ai-card .hd{display:flex; gap:10px; align-items:flex-start}
.ai-card .hd .ic{width:38px; height:38px; border-radius:12px; display:grid; place-items:center; flex:none}
.ai-card .hd .ic svg{width:20px; height:20px}
.ic[data-tone="blue"]{background:var(--blue-bg); color:var(--blue)}
.ic[data-tone="green"]{background:var(--green-bg); color:var(--green)}
.ic[data-tone="rose"]{background:var(--rose-bg); color:var(--rose)}
.ic[data-tone="amber"]{background:var(--amber-bg); color:var(--amber)}
.ic[data-tone="violet"]{background:var(--violet-bg); color:var(--violet)}
.ai-card h3{font-size:.95rem; line-height:1.4}
.ai-card p{margin:4px 0 0; font-size:.85rem; color:var(--ink-2)}
.ai-card .sub{font-size:.75rem; color:var(--ink-3); font-weight:700; margin:12px 0 2px}
.ai-card .cli{background:var(--tint)}
.ai-card .btn{margin-top:12px; width:100%}
.ask{display:flex; gap:8px; margin-top:14px; align-items:center}
.ask input{flex:1; min-width:0; padding:10px 16px; min-height:46px; font-size:16px; border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--ink)}
.ask .send{width:46px; height:46px; border-radius:50%; border:0; background:var(--primary); color:var(--primary-ink); display:grid; place-items:center; flex:none}
.ask .send svg{width:20px; height:20px}
.ask .send[disabled]{opacity:.5}
.answer{margin-top:10px; background:var(--surface); border-radius:4px 18px 18px 18px; padding:12px 14px; box-shadow:var(--shadow); font-size:.9rem; white-space:pre-wrap; word-break:break-word; color:var(--ink-2)}
.answer .q{font-size:.78rem; color:var(--ink-3); margin:0 0 6px; white-space:normal}
.answer .note{font-size:.78rem; color:var(--ink-3); margin-top:6px; white-space:normal}

/* ---------- ボタン・フォーム ---------- */
.btn{min-height:44px; padding:0 18px; border-radius:999px; border:1px solid var(--line-2); background:var(--surface); color:var(--primary); font-weight:600; display:inline-flex; align-items:center; gap:8px; justify-content:center; text-decoration:none}
.btn.primary{background:var(--primary); color:var(--primary-ink); border-color:var(--primary)}
.btn.danger{color:var(--rose); border-color:var(--rose-soft)}
.btn.small{min-height:36px; padding:0 14px; font-size:.85rem}
.btn[disabled]{opacity:.55; cursor:default}
.btn svg{width:18px; height:18px}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px}
.field{margin-top:18px}
.field label, .field .lbl{display:block; font-size:.9rem; font-weight:600; margin-bottom:4px; color:var(--ink)}
.field .help{font-size:.78rem; color:var(--ink-3); margin:0 0 8px}
.field input[type="text"], .field input[type="password"], .field textarea, .field select{width:100%; padding:10px 14px; min-height:44px; font-size:16px; border:1px solid var(--line-2); border-radius:12px; background:var(--surface); color:var(--ink)}
.switch{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0}
.switch input{width:26px; height:26px; accent-color:var(--primary); margin:0}
.info{background:var(--surface); border-radius:18px; box-shadow:var(--shadow); padding:16px; margin-top:12px}
.info h3{font-size:.95rem; margin:0 0 8px}
.info p, .info li{font-size:.86rem; color:var(--ink-2); margin:0}
.info ol{margin:0; padding-left:20px} .info li{margin:4px 0}
.info .meta{font-size:.76rem; color:var(--ink-3); margin-top:8px}
.info a{color:var(--primary); word-break:break-all}

/* ---------- タブバー ---------- */
.tabbar{flex:none; display:flex; border-top:1px solid var(--line); background:var(--surface); padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.64rem; font-weight:600; color:var(--ink-3); background:none; border:0; padding:6px 0 2px; min-height:48px; border-radius:8px}
.tab.is-on{color:var(--primary)}
.tab svg{width:24px; height:24px}

/* ---------- 詳細シート ---------- */
.sheet{position:absolute; inset:0; background:var(--bg); display:flex; flex-direction:column; z-index:20; transform:translateY(100%); visibility:hidden; pointer-events:none;
       transition:transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s linear .28s}
.sheet.is-open{transform:none; visibility:visible; pointer-events:auto; transition:transform .28s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){ .sheet, .sheet.is-open{transition:none} }
.sheet-bar{display:flex; align-items:center; justify-content:space-between; padding:calc(10px + env(safe-area-inset-top)) 12px 0}
.sheet-body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 18px 40px}
.hero{border-radius:18px; padding:18px; background:var(--surface); box-shadow:var(--shadow); background-image:linear-gradient(160deg, var(--tint), transparent 60%)}
.hero .cat{font-size:.75rem; color:var(--ink-3); font-weight:600; letter-spacing:.04em; margin:0}
.hero h2{font-size:1.35rem; line-height:1.35; margin:6px 0 10px; text-wrap:balance}
.hero .meta{display:flex; flex-direction:column; gap:6px; font-size:.88rem; color:var(--ink-2)}
.hero .meta div{display:flex; gap:8px; align-items:flex-start}
.hero .meta svg{width:16px; height:16px; flex:none; margin-top:3px; color:var(--ink-3)}
.hero .meta a{color:var(--primary); text-decoration:none; font-weight:600}
.lvl{display:flex; gap:12px; align-items:center; margin-top:14px}
.lvl .badge{font-size:.85rem; padding:8px 14px}
.lvl p{margin:0; font-size:.85rem; color:var(--ink-2); line-height:1.45}
.tabs{display:flex; border-bottom:1px solid var(--line); margin:18px 0 14px}
.tabs button{flex:1; background:none; border:0; border-bottom:2px solid transparent; padding:10px 0; font-weight:600; color:var(--ink-3); margin-bottom:-1px; min-height:44px}
.tabs button[aria-selected="true"]{color:var(--primary); border-bottom-color:var(--primary)}
.prog{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.prog h3{font-size:1.02rem}
.mini{display:flex; align-items:center; gap:8px; font-weight:700; font-size:.95rem; color:var(--ink)}
.mini svg{width:28px; height:28px; transform:rotate(-90deg)}
.mini .track{fill:none; stroke:var(--ring-track); stroke-width:3.5}
.mini .bar{fill:none; stroke:var(--accent); stroke-width:3.5; stroke-linecap:round; width:auto; border-radius:0; align-self:auto}
.mini.is-done .bar{stroke:var(--teal-soft)}
.ck{display:flex; gap:12px; align-items:center; padding:12px 14px; background:var(--surface); border-radius:14px; box-shadow:var(--shadow); margin-bottom:10px; cursor:pointer}
.ck .ic{width:38px; height:38px; border-radius:11px; display:grid; place-items:center; flex:none; order:0}
.ck .ic svg{width:20px; height:20px}
.ck .tt{flex:1; min-width:0; order:1}
.ck .tt b{display:block; font-size:.95rem; font-weight:600; line-height:1.35; color:var(--ink)}
.ck .tt span{display:block; font-size:.8rem; color:var(--ink-3); margin-top:1px}
.ck input{width:24px; height:24px; accent-color:var(--primary); flex:none; margin:0; order:3}
.ck.is-done{opacity:.75}
.ck.is-done .tt b{text-decoration:line-through; color:var(--ink-3)}
.ck .rm{background:none; border:0; color:var(--ink-3); width:32px; height:32px; display:grid; place-items:center; border-radius:8px; flex:none; order:2}
.ck .rm svg{width:16px; height:16px}
.add{display:flex; gap:8px; margin-top:6px}
.add input{flex:1; min-width:0; padding:10px 14px; min-height:44px; font-size:16px; border:1px solid var(--line-2); border-radius:999px; background:var(--surface); color:var(--ink)}
.ai{margin-top:18px; border-radius:16px; padding:14px 16px; background:var(--violet-bg)}
.ai h3{font-size:.95rem; color:var(--violet); display:flex; align-items:center; gap:8px}
.ai h3 svg{width:18px; height:18px}
.ai p{margin:6px 0 0; font-size:.84rem; color:var(--ink-2)}
.ai .btn{margin-top:10px; background:var(--surface); border-color:transparent; color:var(--violet)}
.ai ul{list-style:none; margin:10px 0 0; padding:0}
.ai li{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid rgba(120,110,200,.18); font-size:.88rem}
.ai li .tt{flex:1; min-width:0}
.ai li .tt span{display:block; font-size:.78rem; color:var(--ink-3)}
.ai .note{font-size:.78rem; color:var(--ink-3); margin-top:8px}
.memo{width:100%; min-height:180px; padding:12px 14px; font-size:16px; line-height:1.6; border:1px solid var(--line-2); border-radius:14px; background:var(--surface); color:var(--ink); resize:vertical}
.desc{white-space:pre-wrap; word-break:break-word; font-size:.9rem; color:var(--ink-2); margin:0; line-height:1.6}
.desc a{color:var(--primary); word-break:break-all}
.kv{margin:0; padding:0 16px; list-style:none}
.kv li{display:flex; gap:12px; padding:10px 0; border-top:1px solid var(--line); font-size:.9rem}
.kv li:first-child{border-top:0}
.kv li b{width:72px; flex:none; color:var(--ink-3); font-weight:600; font-size:.82rem; padding-top:2px}
.kv li span{flex:1; min-width:0; word-break:break-word}

.toast{position:absolute; left:50%; bottom:calc(76px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(8px);
       background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:18px; font-size:.85rem; font-weight:600;
       opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:30; width:max-content; max-width:calc(100% - 32px); text-align:center; line-height:1.4}
.toast.is-on{opacity:1; transform:translateX(-50%)}
</style>

<script>
"use strict";
/* ============================================================
   Sakiyomi（先読み） — Googleカレンダーの先の予定から「準備すべきこと」を提案する AI秘書
   データの取り方は3通り: claude.ai の連携（mcp）／ 暗号化された同期データ（GitHub Pages）／ サンプル
   ============================================================ */
const SERVER = "Google Calendar";
const HOLIDAY_CAL = "ja.japanese#holiday@group.v.calendar.google.com";
const MIN = 60000, DAY = 86400000;
const WD = "日月火水木金土";
const FEED_URL = "data/events.enc";
const PBKDF2_ITER = 100000;
const DAYS = 31;                                   // 表示・取得する期間（1ヶ月）
const CLAUDE_URL = "https://claude.ai/code/artifact/7d1258a3-4227-4de0-8556-4f3a71ca1297";

/* ---------- 端末内の保存（使えない環境でも落ちない） ---------- */
const MEM = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return (k in MEM) ? MEM[k] : d; } },
  set(k, v){ MEM[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ delete MEM[k]; try{ localStorage.removeItem(k); }catch(e){} },
  keys(prefix){ const out = new Set(Object.keys(MEM).filter(k => k.startsWith(prefix))); try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith(prefix)) out.add(k); } }catch(e){} return [...out]; }
};
const DEFAULTS = { weeks:3, routine:["会社","出社","在宅","テレワーク","リモート"], calendarId:"", holidays:true, name:"" };
let S = Object.assign({}, DEFAULTS, store.get("settings", {}));
if (!Array.isArray(S.routine)) S.routine = DEFAULTS.routine.slice();
if (![2,3,4].includes(S.weeks)) S.weeks = 3;
if (typeof S.name !== "string") S.name = "";

/* ---------- 小道具 ---------- */
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const hhmm = (d) => `${d.getHours()}:${pad(d.getMinutes())}`;
const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const startOfDay = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const md = (d) => `${d.getMonth()+1}/${d.getDate()}`;
const jpDate = (d) => `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`;
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[ch]); }
function safeHttp(u){ return /^https?:\/\//i.test(String(u || "")) ? String(u) : ""; }
function localDate(s){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s)); return m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(s); }
function isoLocal(d){
  const off = -d.getTimezoneOffset(), sg = off >= 0 ? "+" : "-", a = Math.abs(off);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00${sg}${pad(Math.floor(a/60))}:${pad(a%60)}`;
}
function daysUntil(d, now){ return Math.round((startOfDay(d) - startOfDay(now)) / DAY); }
function relDay(n){ return n <= 0 ? "今日" : n === 1 ? "明日" : n === 2 ? "あさって" : `${n}日後`; }
function hit(hay, words){ const h = (hay || "").toLowerCase(); return words.some(w => h.includes(String(w).toLowerCase())); }
function durText(ms){ const m = Math.round(ms/MIN); const h = Math.floor(m/60), r = m%60; return h ? (r ? `${h}時間${r}分` : `${h}時間`) : `${r}分`; }
function dayClass(d, hol){ return hol ? "is-hol" : d.getDay() === 0 ? "is-sun" : d.getDay() === 6 ? "is-sat" : ""; }
function tz(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Tokyo"; }catch(e){ return "Asia/Tokyo"; } }
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("is-on"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("is-on"), 1800); }
function weekLabel(w){ return w === 0 ? "今週" : `${w}週間先`; }

/** 「会社」「移動」のような語が、タイトルの先頭で単語として使われているか（「会社説明会」「運転免許更新」は当てない） */
function startsWord(t, r){ return t === r || (t.startsWith(r) && /^[\s\u3000、,，・（(\[【:：→\-–—\/]/.test(t.slice(r.length))); }
function isRoutine(ev){ const t = ev.title.trim(); return ev.recurring && S.routine.some(r => r && startsWord(t, r)); }
function isMove(ev){ const t = ev.title.trim(); return ["移動","電車","バス","運転","家出発"].some(m => startsWord(t, m)); }
function hasUrl(s){ return /https?:\/\/\S+/i.test(s || ""); }

/** 予定を分類して、レベルとチェックリストの土台を返す */
function classify(ev){
  const hay = `${ev.title} ${ev.location}`;
  if (isRoutine(ev)) return { key:"routine", label:"定型の予定", level:"easy", items:[], insight:null };
  if (isMove(ev)) return { key:"move", label:"移動", level:"easy", items:[], insight:null };
  const rule = RULES.find(r => hit(hay, r.match));
  const items = [];
  const push = (id, it) => { if (!it.when || hit(hay, it.when)) items.push({ id, kind:it.kind, title:it.title, note:it.note }); };
  let level, key, label, insight = null;
  if (rule){
    key = rule.key; label = rule.label; level = rule.level;
    rule.items.forEach((it, i) => push(`${rule.key}-${i}`, it));
    if (rule.insight && (!rule.insight.when || hit(hay, rule.insight.when))) insight = rule.insight.text;
    else if (rule.insightAlt) insight = rule.insightAlt.text;
  } else if (ev.allDay){
    key = "other"; label = "その他の予定"; level = "easy";
    push("o-0", I("check","予定の内容を確認",""));
  } else if (ev.location || ev.attendees.length){
    key = "other"; label = "その他の予定"; level = "check";
    push("o-0", I("check","場所と開始時刻を確認",""));
    push("o-1", I("bag","持ち物を確認",""));
  } else {
    key = "other"; label = "その他の予定"; level = "easy";
    push("o-0", I("check","予定の内容を確認",""));
  }
  // 予定そのものが持つ手がかりから追加
  if (ev.attendees.length && !items.some(i => i.kind === "phone") && key !== "fun")
    push("sig-contact", I("phone","参加者に事前連絡", `${ev.attendees.length}人に時間と場所を共有`));
  if (ev.location && !ev.allDay && !items.some(i => i.kind === "route"))
    push("sig-route", I("route","移動時間を確認", ev.location));
  if (hasUrl(ev.description) && !ev.location)
    push("sig-url", I("check","参加URLを確認","開始5分前には接続"));
  if (ev.reservation && !items.some(i => i.kind === "book"))
    push("sig-book", I("book","予約内容を確認", ev.reservation));
  return { key, label, level, items, insight };
}


/* ---------- 予定の正規化 ---------- */
function normalize(payload){
  const raw = (payload && Array.isArray(payload.events)) ? payload.events : [];
  const out = [], gmail = [];
  for (const e of raw){
    if (!e || e.status === "cancelled") continue;
    const allDay = !!(e.start && e.start.date && !e.start.dateTime);
    const s = e.start && (e.start.dateTime || e.start.date);
    if (!s) continue;
    const en = e.end && (e.end.dateTime || e.end.date);
    const start = allDay ? localDate(s) : new Date(s);
    let end = allDay ? localDate(en || s) : new Date(en || s);
    if (isNaN(start)) continue;
    if (isNaN(end) || end < start) end = new Date(start);
    if (allDay && end > start) end = new Date(end.getTime() - 1); // 終了日は「翌日0:00」で来るので前日の終わりに
    const attendees = (Array.isArray(e.attendees) ? e.attendees : [])
      .filter(a => a && !a.self && !a.resource).map(a => a.displayName || a.email || "").filter(Boolean);
    const ev = {
      id: String(e.id || `${s}-${e.summary || ""}`),
      title: String(e.summary || "").trim() || "（タイトルなし）",
      location: String(e.location || ""), description: String(e.description || ""),
      allDay, start, end, attendees, link: String(e.htmlLink || ""),
      recurring: !!e.recurringEventId, fromGmail: e.eventType === "FROM_GMAIL", reservation: ""
    };
    (ev.fromGmail ? gmail : out).push(ev);
  }
  // Gmailの予約メールから作られた予定は、同じ時間の自分の予定へ「予約情報」として合流
  for (const g of gmail){
    const near = o => !o.allDay && Math.abs(o.start - g.start) <= 30 * MIN;
    const host = out.find(o => near(o) && !o.reservation) || out.find(near);
    if (host){ host.reservation = g.location || g.title; if (!host.location) host.location = g.location; }
    else out.push(g);
  }
  out.sort((a, b) => a.start - b.start || a.title.localeCompare(b.title, "ja"));
  return out;
}
function prepare(events){ for (const ev of events){ ev.cls = classify(ev); ev.routine = ev.cls.key === "routine"; ev.move = ev.cls.key === "move"; } return events; }

/* ---------- 提案（チェック状態は持たない） ---------- */
function itemsOf(ev){ return ev.cls.items; }
function effLevel(ev){ return ev.cls.level; }
/* 済みにした提案は端末に覚えておき、一覧から消す */
function doneMap(ev){ return store.get(`done:${ev.id}`, {}) || {}; }
function pendingItems(ev){ const d = doneMap(ev); return itemsOf(ev).filter(it => !d[it.id]); }
function doneCount(ev){ const d = doneMap(ev); return itemsOf(ev).filter(it => d[it.id]).length; }
function isFinished(ev){ return itemsOf(ev).length > 0 && pendingItems(ev).length === 0; }
function markDone(ev, itemId, on){ const d = doneMap(ev); if (on) d[itemId] = true; else delete d[itemId]; if (Object.keys(d).length) store.set(`done:${ev.id}`, d); else store.del(`done:${ev.id}`); }
function resetDone(ev){ store.del(`done:${ev.id}`); }

const byId = (id) => EV.find(e => e.id === id) || null;
function visible(now){
  const max = DAYS;
  return EV.filter(ev => { const d = daysUntil(ev.start, now); const de = daysUntil(ev.end, now); return de >= 0 && d < max; });
}
function bucketDay(ev, now){ return Math.max(0, daysUntil(ev.start, now)); }
function bucketWeek(ev, now){ return Math.floor(bucketDay(ev, now) / 7); }

/* ---------- 1ヶ月のまとめ ---------- */
function monthSummary(events, now){
  const all = events.filter(ev => !ev.routine && !ev.move && ev.cls.level !== "easy").sort((a, b) => a.start - b.start);
  const main = all.filter(ev => !isFinished(ev)), finished = all.filter(isFinished);
  const prep = main.filter(ev => ev.cls.level === "prep"), check = main.filter(ev => ev.cls.level === "check");
  const urgent = prep.find(ev => bucketDay(ev, now) <= 2) || null;
  const weekPrep = prep.filter(ev => bucketDay(ev, now) <= 6);
  return { main, finished, prep, check, urgent, weekPrep };
}
function weekName(w){ return ["今週", "来週", "再来週", "その先"][Math.min(w, 3)]; }

/* ---------- 描画：共通部品 ---------- */
function badge(ev){ const l = effLevel(ev); return `<span class="badge ${l}">${LEVEL[l].label}</span>`; }
function timeText(ev){
  if (ev.allDay){ const n = daysUntil(ev.end, ev.start) + 1; return n > 1 ? `終日・${n}日間` : "終日"; }
  return `${hhmm(ev.start)}–${hhmm(ev.end)}`;
}
function locHtml(ev){ return ev.location ? `<span class="loc"><svg><use href="#i-pin"/></svg>${esc(ev.location)}</span>` : ""; }
function kindChip(ev){ return `<span class="chip">${esc(ev.cls.label)}</span>`; }
function ringHtml(pct, size, sw){
  const r = (size - sw) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, pct)) / 100);
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="track" cx="${size/2}" cy="${size/2}" r="${r}"/><circle class="bar" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>`;
}
function explain(err){
  const c = err && err.code;
  if (c === "no_mcp") return ["warn", "このページからはカレンダーを読めません", "claude.ai にログインした状態で、このページの claude.ai のURL（claude.ai/code/artifact/…）を開くと、Google カレンダーの予定を読み込みます。", true];
  if (c === "need_key") return ["warn", "合言葉を入れると予定を表示します", "このページの予定データは暗号化されています。Macの同期設定で決めた合言葉を入れてください（この端末に保存されます）。"];
  if (c === "bad_key") return ["err", "合言葉が違うようです", "もう一度入力してください。合言葉は Mac の prep-compass/sync/.secret に書いてあります。"];
  if (c === "no_feed") return ["warn", "予定データがまだありません", "Mac の同期（Sakiyomi の定期タスク）が一度動くと、ここに予定が出ます。", false];
  if (c === "feed_error") return ["err", "予定データを読み込めませんでした", "通信状況を確認して、右上の更新ボタンを押してください。" + (err.message ? `（詳細: ${String(err.message).slice(0, 100)}）` : "")];
  if (c === "needs_reauth") return ["err", "Google カレンダーの接続が切れています", "claude.ai の「設定 → コネクター」で Google カレンダーをつなぎ直してください。"];
  if (c === "server_not_connected") return ["err", "Google カレンダーがつながっていません", "claude.ai の「設定 → コネクター」で Google カレンダーを追加すると、ここに予定が出ます。"];
  if (c === "selection_required") return ["err", "どのカレンダーを使うか選んでください", "同じ名前のコネクターが複数あります。画面に出る選択肢からひとつ選ぶと読み込めます。"];
  if (c === "not_in_manifest") return ["err", "このページにカレンダーの利用が許可されていません", "ページを開いたときの確認で「許可」を選ぶと読み込めます。開き直しても表示されないときは、このページを作った人にカレンダー連携の設定を確認してもらってください。"];
  if (c === "blocked_by_policy" || c === "approval_required") return ["err", "このカレンダーは今の設定では読めません", "会社や学校の Google アカウントでは、組織の設定でカレンダー連携が制限されていることがあります。個人のアカウントでこの表示が出るときは、少し時間を置いてから右上の更新ボタンを押してください。"];
  if (c === "not_granted" || c === "capability_disabled" || c === "capability_removed") return ["err", "このページからカレンダーを読めません", "claude.ai のアプリ内でこのページを開くと、予定を読み込めます。"];
  if (c === "server_unavailable" || c === "rate_limited") return ["warn", "カレンダーに一時的につながりません", "しばらくしてから、右上の更新ボタンを押してください。"];
  const detail = err && err.message ? `（詳細: ${String(err.message).slice(0, 120)}）` : "";
  if (c === "tool_error") return ["err", "カレンダーがエラーを返しました", "しばらくしてから、右上の更新ボタンをもう一度押してください。" + detail];
  return ["err", "カレンダーを読み込めませんでした", "しばらくしてからもう一度お試しください。" + detail];
}

/* ---------- 描画：あいさつ・状態 ---------- */
function greeting(now){
  const h = now.getHours();
  const g = h < 5 ? "こんばんは" : h < 10 ? "おはようございます" : h < 17 ? "こんにちは" : "こんばんは";
  const icon = (h >= 5 && h < 17) ? "i-sun" : "i-moon";
  return `${esc(g)}${S.name ? `<span class="nm">${esc(S.name)}さん</span>` : ""}<svg class="wx" aria-hidden="true"><use href="#${icon}"/></svg>`;
}
function bubbleText(sm, now){
  if (META.loading) return "予定を読み込んでいます。少しお待ちください。";
  if (!META.ok && !META.demo) return "まだ予定を読み込めていません。下の案内を確認してください。";
  if (!sm.main.length) return sm.finished.length ? "この1ヶ月の準備はすべて済んでいます。おつかれさまです。" : "この1ヶ月、特別な準備がいる予定はありません。ゆっくり過ごせそうです。";
  if (sm.urgent) return `${relDay(bucketDay(sm.urgent, now))}の「${sm.urgent.title}」に向けて、そろそろ準備を始めましょう。`;
  if (sm.weekPrep.length) return `今週は要準備の予定が${sm.weekPrep.length}件あります。早めに手をつけると、余裕のある一週間になります。`;
  if (sm.prep.length) return `この1ヶ月で要準備の予定は${sm.prep.length}件。いちばん近いのは${relDay(bucketDay(sm.prep[0], now))}の「${sm.prep[0].title}」です。`;
  return `この1ヶ月は確認だけで済む予定が${sm.check.length}件。予約や時間の確認をしておきましょう。`;
}
function renderStatus(){
  const st = $("h-status");
  const when = META.stamp ? `${md(new Date(META.stamp))} ${hhmm(new Date(META.stamp))} 更新` : "";
  const srcLabel = META.source === "feed" ? "同期した予定を表示中" : "Googleカレンダーと連携中";
  if (META.loading){ st.dataset.state = "loading"; st.querySelector(".lbl").textContent = "予定を読み込んでいます…"; st.querySelector(".when").textContent = ""; }
  else if (META.demo){ st.dataset.state = "demo"; st.querySelector(".lbl").textContent = "サンプルの予定を表示中"; st.querySelector(".when").textContent = ""; }
  else if (META.ok){
    const stale = META.source === "feed" && META.stamp && (Date.now() - META.stamp) > 8 * 3600000;
    st.dataset.state = stale ? "demo" : "ok"; st.querySelector(".lbl").textContent = stale ? "しばらく同期されていません" : srcLabel; st.querySelector(".when").textContent = when;
  }
  else { st.dataset.state = "error"; st.querySelector(".lbl").textContent = "予定を読み込めません"; st.querySelector(".when").textContent = META.stamp ? `（${hhmm(new Date(META.stamp))}時点の予定を表示）` : ""; }

  if (META.error){
    let [kind, title, body, offerDemo] = explain(META.error);
    if (EV.length && META.stamp && !DENIALS.includes(META.error.code)) kind = "warn";
    const keyForm = (META.error.code === "need_key" || META.error.code === "bad_key")
      ? `<form class="actions" data-act="key-form"><label class="sr" for="key-in">合言葉</label><input type="password" id="key-in" autocomplete="off" placeholder="合言葉" enterkeyhint="go"><button class="btn small primary" type="submit">表示する</button></form>` : "";
    $("h-notice").innerHTML = `<div class="notice ${kind}"><h3><svg><use href="#i-alert"/></svg>${esc(title)}</h3><p>${esc(body)}</p>${keyForm}
      ${offerDemo ? `<div class="actions"><button class="btn small" type="button" data-act="demo">サンプルの予定で試す</button></div>` : ""}</div>`;
  } else $("h-notice").innerHTML = "";
}
function renderGreeting(sm, now){
  $("h-date").textContent = jpDate(now);
  $("h-greet").innerHTML = greeting(now);
  $("h-bubble").innerHTML = `<p>${esc(bubbleText(sm, now))}</p>`;
}
function renderStats(sm){
  $("h-tiles").style.gridTemplateColumns = "repeat(2, 1fr)";
  $("h-tiles").innerHTML = `<div class="tile"><span class="lbl"><i class="dot prep"></i>要準備</span><b class="num">${sm.prep.length}<small>件</small></b></div>
    <div class="tile"><span class="lbl"><i class="dot check"></i>確認のみ</span><b class="num">${sm.check.length}<small>件</small></b></div>`;
}

/* ---------- 描画：予定と準備の提案（要準備・確認のみの予定だけ。1ヶ月ぶん） ---------- */
function sugList(ev, max){
  const items = pendingItems(ev), shown = max ? items.slice(0, max) : items, done = doneCount(ev);
  const rows = shown.map((it, i) => { const k = KIND[it.kind] || KIND.check, cid = `d-${esc(ev.id)}-${i}`;
    return `<li><label class="sgrow" for="${cid}"><span class="ic" data-tone="${k.tone}" aria-hidden="true"><svg><use href="#${k.icon}"/></svg></span><span class="tx"><b>${esc(it.title)}</b>${it.note ? `<small>${esc(it.note)}</small>` : ""}</span><input type="checkbox" id="${cid}" data-act="done" data-ev="${esc(ev.id)}" data-item="${esc(it.id)}" aria-label="${esc(it.title)} を済みにする"></label></li>`; }).join("");
  const more = max && items.length > max ? `<li class="mo"><button class="more" type="button" data-act="open" data-id="${esc(ev.id)}">他${items.length - max}件の提案を見る<svg><use href="#i-right"/></svg></button></li>` : "";
  const foot = done ? `<div class="sug-foot"><span>済み ${done}件</span><button type="button" data-act="undo" data-id="${esc(ev.id)}">戻す</button></div>` : "";
  return `<ul class="sug">${rows}${more}</ul>${foot}`;
}
function sugCard(ev, now){
  const d = bucketDay(ev, now), dd = ev.start, hol = HOL[dayKey(dd)];
  return `<article class="task">
    <button class="task-h" type="button" data-act="open" data-id="${esc(ev.id)}">
      <span class="dcol ${dayClass(dd, hol)}"><b class="num">${md(dd)}</b><span class="num">${WD[dd.getDay()]}${hol ? "・祝" : ""} ${ev.allDay ? "終日" : hhmm(dd)}</span></span>
      <span class="tcol"><b>${esc(ev.title)}</b>${locHtml(ev)}<span class="bd">${badge(ev)}${kindChip(ev)}</span></span>
      <span class="due${d <= 2 && ev.cls.level === "prep" ? " soon" : ""} num">${relDay(d)}</span></button>
    ${ev.cls.insight ? `<p class="hint"><svg><use href="#i-bulb"/></svg>${esc(ev.cls.insight)}</p>` : ""}
    ${sugList(ev, 4)}</article>`;
}
function renderTasks(sm, now){
  const groups = [[], [], [], []];
  for (const ev of sm.main) groups[Math.min(bucketWeek(ev, now), 3)].push(ev);
  const today = startOfDay(now);
  let html = "";
  groups.forEach((g, w) => {
    if (!g.length) return;
    const from = addDays(today, w * 7), to = w < 3 ? addDays(from, 6) : addDays(today, DAYS - 1);
    html += `<div class="wk-h">${weekName(w)}<span class="num">${md(from)}（${WD[from.getDay()]}）– ${md(to)}（${WD[to.getDay()]}）</span></div>` + g.map(ev => sugCard(ev, now)).join("");
  });
  if (sm.finished.length) html += `<div class="routine-box finished"><details class="routine"><summary><span class="n">準備が完了した予定 ${sm.finished.length}件</span><span class="badge done">完了</span><svg><use href="#i-right"/></svg></summary>${sm.finished.map(ev => `<div class="rrow"><b class="num">${md(ev.start)}（${WD[ev.start.getDay()]}）</b><span>${esc(ev.title)}</span><button class="btn small" type="button" data-act="undo" data-id="${esc(ev.id)}">戻す</button></div>`).join("")}</details></div>`;
  $("tasks-note").textContent = sm.main.length ? `1ヶ月で${sm.main.length}件。チェックすると消えます` : "";
  $("h-tasks").innerHTML = html || `<div class="card"><p class="empty">${META.loading ? "読み込み中…" : sm.finished.length ? "この1ヶ月の準備はすべて済みました。" : "この1ヶ月、準備がいる予定はありません。"}</p></div>`;
}

/* ---------- 描画：AIアシスタント（予定単位ではなく、全体の見通しと相談） ---------- */
function briefing(events, now){
  const out = [], main = events.filter(ev => !ev.routine && !ev.move && ev.cls.level !== "easy"), today = startOfDay(now);
  const soon = main.filter(ev => bucketDay(ev, now) <= 2);
  if (soon.length) out.push({ tone:"blue", icon:"i-clock", text:`3日以内の予定は${soon.length}件：${soon.slice(0, 4).map(ev => `${ev.title}（${relDay(bucketDay(ev, now))}）`).join("、")}${soon.length > 4 ? " ほか" : ""}。` });
  else out.push({ tone:"green", icon:"i-check", text:"3日以内に予定はありません。少し先の準備に手をつけるチャンスです。" });
  const perDay = {}; for (const ev of main){ const k = dayKey(addDays(today, bucketDay(ev, now))); perDay[k] = (perDay[k] || 0) + 1; }
  const busy = Object.keys(perDay).filter(k => perDay[k] >= 3).sort().map(k => localDate(k));
  if (busy.length) out.push({ tone:"amber", icon:"i-alert", text:`${busy.slice(0, 2).map(d => `${md(d)}（${WD[d.getDay()]}）`).join("・")}は予定が3件以上。移動と休憩に余裕を持たせましょう。` });
  const hols = Object.keys(HOL).sort().filter(k => { const d = daysUntil(localDate(k), now); return d >= 0 && d < DAYS; });
  if (hols.length) out.push({ tone:"rose", icon:"i-cal", text:`${hols.slice(0, 3).map(k => `${md(localDate(k))} ${HOL[k]}`).join("、")}。休みの前後は、予約や締切のずれに注意。` });
  const far = main.filter(ev => ev.cls.level === "prep" && bucketDay(ev, now) >= 14 && !isFinished(ev));
  if (far.length) out.push({ tone:"violet", icon:"i-list", text:`2週間より先の要準備は${far.length}件：${far.slice(0, 3).map(ev => `${ev.title}（${md(ev.start)}）`).join("、")}。交通や宿の予約は今のうちに。` });
  return out;
}
function renderAssistant(events, now){
  const items = META.loading ? [] : briefing(events, now);
  const askable = !!sampleFn;
  $("ai-note").textContent = askable ? "見通しと相談" : "相談は claude.ai 版で使えます";
  let chat = "";
  if (askable){
    const out = CHAT.q ? `<div class="answer"><p class="q">Q. ${esc(CHAT.q)}</p>${CHAT.busy && !CHAT.a ? "考え中…（数秒かかります）" : esc(CHAT.a)}${CHAT.err ? `<p class="note">${esc(CHAT.err)}</p>` : ""}</div>` : "";
    chat = `<form class="ask" id="ask-form" data-act="ask-form"><label class="sr" for="ask-in">質問や相談</label><input type="text" id="ask-in" placeholder="質問や相談を入力…（例：来週の持ち物は？）" autocomplete="off" enterkeyhint="send"${CHAT.busy ? " disabled" : ""}><button class="send" type="submit" aria-label="送信"${CHAT.busy ? " disabled" : ""}><svg><use href="#i-up"/></svg></button></form>${out}`;
  } else chat = `<p class="empty" style="padding:10px 2px 0">予定についてAIに相談するには、<a href="${CLAUDE_URL}" target="_blank" rel="noopener noreferrer" style="color:var(--primary)">claude.ai 版</a>を開いてください。</p>`;
  $("h-ai").innerHTML = `<div class="ai-intro"><span class="avatar" aria-hidden="true"><svg><use href="#avatar"/></svg></span><p><b>Sakiyomi</b>1ヶ月先までの見通しをまとめました。</p></div>
    ${items.length ? `<div class="brief">${items.map(b => `<div class="b"><span class="ic" data-tone="${b.tone}"><svg><use href="#${b.icon}"/></svg></span><span>${esc(b.text)}</span></div>`).join("")}</div>` : `<div class="card" style="margin-top:12px"><p class="empty">読み込み中…</p></div>`}${chat}`;
}
async function askAssistant(q){
  if (!sampleFn || CHAT.busy || !q) return;
  const now = new Date();
  const ctx = visible(now).filter(ev => !ev.move && !ev.routine).slice(0, 40).map(ev => {
    const todo = pendingItems(ev).map(it => it.title).slice(0, 5);
    return `- ${md(ev.start)}(${WD[ev.start.getDay()]}) ${ev.allDay ? "終日" : hhmm(ev.start)} ${ev.title}${ev.location ? ` @${ev.location}` : ""} [${LEVEL[ev.cls.level].label}]${todo.length ? `：提案 ${todo.join("、")}` : ""}`;
  }).join("\n");
  CHAT = { busy:true, q, a:"", err:null }; renderHome();
  const prompt = `あなたは「Sakiyomi（先読み）」というアプリのAI秘書です。ユーザーの今後の予定と準備状況をもとに、質問に日本語で答えてください。

今日: ${jpDate(now)}
今後1ヶ月の予定（日付順。[ ]は準備の重さ、その後ろはアプリが出している準備の提案）:
${ctx || "（予定はありません）"}

ユーザーの質問: ${q.slice(0, 500)}

条件: 予定に基づいて具体的に。250字以内、箇条書き可。わからないことは推測せず「予定からは分かりません」と言う。`;
  try{
    const res = await sampleFn(prompt, { modelTier:"quick", onText: ({ text }) => { CHAT.a = text; const el = document.querySelector("#h-ai .answer"); if (el) el.innerHTML = `<p class="q">Q. ${esc(CHAT.q)}</p>${esc(text)}`; } });
    CHAT = { busy:false, q, a:res.text, err: res.truncated ? "（長くなったので途中までです）" : null };
  }catch(e){
    const c = e && e.code;
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){ sampleFn = null; CHAT = { busy:false, q:"", a:"", err:null }; }
    else CHAT = { busy:false, q, a: (e && e.text) || "", err: c === "rate_limited" ? "混み合っています。少し待ってからもう一度お試しください。" : c === "cancelled" ? "中止しました。" : "答えを受け取れませんでした。しばらくしてからお試しください。" };
  }
  renderHome();
}

/* ---------- 描画：ホーム全体 ---------- */
function renderHome(){
  const now = new Date();
  renderStatus();
  const events = visible(now), sm = monthSummary(events, now);
  renderGreeting(sm, now);
  renderStats(sm);
  renderTasks(sm, now);
  renderAssistant(events, now);
}

}

/* ---------- 描画：詳細シート ---------- */
function openDetail(id){
  const ev = byId(id); if (!ev) return;
  DETAIL = id;
  if (AI.forId !== id) AI = { busy:false, list:null, err:null, forId:id };
  renderDetail();
  const sh = $("sheet"); sh.classList.add("is-open"); sh.setAttribute("aria-hidden", "false");

  const items = itemsOf(ev).map(i => `- ${i.title}${i.note ? `（${i.note}）` : ""}`).join("\n") || "（なし）";
  const prompt = `あなたは予定の事前準備を手伝うアシスタントです。次の予定について、まだチェックリストに無い「事前にやっておくとよいこと」を、日本語で最大3つ提案してください。

場所: ${ev.location || "未記入"}
参加者: ${ev.attendees.length ? ev.attendees.join("、") : "未記入"}
説明: ${(ev.description || "").replace(/\s+/g, " ").slice(0, 600) || "なし"}

既にあるチェックリスト:
${items}

条件: 既存の項目と重複しない。具体的で短い（titleは20字以内）。この予定の性質に合わないものは出さない。十分なら空配列でよい。
出力は次の形のJSON配列のみ: [{"title":"○○を確認する","note":"補足を20字以内"}]`;
  try{

      .slice(0, 3).map(x => ({ title:x.title.trim().slice(0, 60), note: typeof x.note === "string" ? x.note.trim().slice(0, 80) : "" })) : [];

}

function windowArgs(now){
  const from = startOfDay(now), to = addDays(from, DAYS);
  const args = { startTime: isoLocal(from), endTime: isoLocal(to), orderBy:"startTime", pageSize:250, timeZone: tz() };

const DENIALS = ["needs_reauth","server_not_connected","selection_required","blocked_by_policy","approval_required","not_granted","capability_disabled","capability_removed","not_in_manifest"];

async function applyPayload(result, input){
  let payload = result && result.payload;
  if (typeof payload === "string"){ try{ payload = JSON.parse(payload); }catch(e){ payload = null; } }
  let events = (payload && Array.isArray(payload.events)) ? payload.events.slice() : [];
  // 念のため続きのページも読む（予定が250件を超えるとき）
  let token = payload && payload.nextPageToken, pages = 0;
  while (token && pages < 3 && mcp){
    try{
      const r = await mcp.callTool(SERVER, "list_events", Object.assign({}, input, { pageToken: token }), { cache:{ staleTime:60000 } });
      let p = r && r.payload; if (typeof p === "string"){ try{ p = JSON.parse(p); }catch(e){ p = null; } }
      if (p && Array.isArray(p.events)) events = events.concat(p.events); token = p && p.nextPageToken; pages++;
    }catch(e){ break; }
  }
  EV = prepare(normalize({ events }));
  META = { ok:true, demo:false, loading:false, error:null, stamp: (result && result.cache && result.cache.storedAt) || Date.now() };
  renderAll();
}
function startWatch(force){
  if (!mcp) return;

  const now = new Date(); watchedDay = dayKey(now); const input = windowArgs(now);
  META.loading = !!force || !META.ok; retried = false; renderHome();
  unwatch = mcp.watchTool(SERVER, "list_events", input, (ev) => {
    if (ev.type === "data"){ retried = false; applyPayload(ev.result, input); return; }
    const err = ev.error || {};
    if (DENIALS.includes(err.code)){ EV = []; META = { ok:false, demo:false, loading:false, error:err, stamp:null }; }
    else META = Object.assign({}, META, { loading:false, error:err, ok: META.ok && EV.length > 0 });
    renderAll();
    if (err.retryable && !retried){ retried = true; setTimeout(() => refresh(true), Math.min(err.retryAfterMs || 4000, 60000) + Math.random() * 1000); }
  }, { cache:{ staleTime:60000 }, refetchInterval:300000 });
  startHolidayWatch();
}
function startHolidayWatch(){

/* ---------- 同期データ（GitHub Pages 版）: OpenSSL enc -aes-256-cbc -pbkdf2 形式を復号 ---------- */
async function decryptFeed(buf, pass){
  const u = new Uint8Array(buf);
  if (u.length < 32 || String.fromCharCode.apply(null, u.slice(0, 8)) !== "Salted__") throw Object.assign(new Error("形式が違います"), { code:"feed_error" });
  const salt = u.slice(8, 16), data = u.slice(16);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name:"PBKDF2", hash:"SHA-256", salt, iterations: PBKDF2_ITER }, km, 384));
  const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), { name:"AES-CBC" }, false, ["decrypt"]);
  let plain;
  try{ plain = await crypto.subtle.decrypt({ name:"AES-CBC", iv: bits.slice(32, 48) }, key, data); }
  catch(e){ throw Object.assign(new Error("bad key"), { code:"bad_key" }); }
  return new TextDecoder().decode(plain);
}
async function loadFeed(force){
  META.loading = true; renderHome();
  try{
    const r = await fetch(`${FEED_URL}?t=${force ? Date.now() : Math.floor(Date.now() / 300000)}`, { cache:"no-store" });
    if (r.status === 404){ FEED.available = false; META = { ok:false, demo:false, loading:false, error:{ code:"no_feed" }, stamp:null, source:"feed" }; renderAll(); return; }
    if (!r.ok) throw Object.assign(new Error(`HTTP ${r.status}`), { code:"feed_error" });
    const buf = await r.arrayBuffer();
    FEED.available = true;
    if (!KEY){ META = { ok:false, demo:false, loading:false, error:{ code:"need_key" }, stamp:null, source:"feed" }; renderAll(); renderSettings(); return; }
    let payload;
    try{ payload = JSON.parse(await decryptFeed(buf, KEY)); }
    catch(e){ if (e && e.code === "feed_error") throw e; throw Object.assign(new Error("bad key"), { code:"bad_key" }); }
    EV = prepare(normalize(payload));
    const map = {};
    if (S.holidays) for (const e of (Array.isArray(payload.holidays) ? payload.holidays : [])){
      const s = e && e.start && (e.start.date || e.start.dateTime); if (!s || e.status === "cancelled") continue;
      map[dayKey(e.start.date ? localDate(s) : new Date(s))] = String(e.summary || "祝日");
    }
    HOL = map;
    const gen = payload.generatedAt ? Date.parse(payload.generatedAt) : NaN;
    META = { ok:true, demo:false, loading:false, error:null, stamp: isNaN(gen) ? Date.now() : gen, source:"feed" };
    renderAll(); renderSettings();
  }catch(e){
    const code = (e && e.code) || "feed_error";
    if (code === "bad_key"){ EV = []; META = { ok:false, demo:false, loading:false, error:{ code }, stamp:null, source:"feed" }; }
    else META = Object.assign({}, META, { loading:false, error:{ code, message: e && e.message }, source:"feed" });
    renderAll();
  }
}

    A(24, 2, "大阪出張", { location:"大阪市" }),
    T(27, 19, 0, 21, 0, "同期会", { location:"新宿" })
  ];
  for (let d = 0; d < DAYS; d++){ const wd = at(d, 0, 0).getDay(); if (wd >= 1 && wd <= 5) events.push(T(d, 8, 30, 18, 30, "会社", { recurringEventId:"demo-work" })); }
  return { events };
}
function loadDemo(){
  watchedDay = dayKey(new Date());
  EV = prepare(normalize(demoPayload(new Date())));
  META = { ok:true, demo:true, loading:false, error:null, stamp:null, source:"demo" };
  renderAll(); toast("サンプルの予定を表示しています");
}

/* ---------- 起動 ---------- */
$("btn-refresh").addEventListener("click", () => refresh(false));
renderHome();
setInterval(() => {
  const k = dayKey(new Date());
  if (watchedDay && k !== watchedDay){ watchedDay = k; if (mcp) startWatch(); else if (META.demo) loadDemo(); else if (FEED.available) loadFeed(false); }
}, 60000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  renderAll();
  if (!mcp && FEED.available && META.stamp && Date.now() - META.stamp > 10 * MIN) loadFeed(false);
});

(async () => {
  readKeyFromHash();
  const use = (name) => (window.claude && typeof window.claude.use === "function") ? window.claude.use(name).catch(() => null) : Promise.resolve(null);
  const [m, s] = await Promise.all([use("mcp"), use("sample")]);
  mcp = m; sampleFn = s;
  if (mcp){ renderSettings(); startWatch(); loadCalendars(); return; }
  if (/^https?:$/.test(location.protocol) && !window.claude){ await loadFeed(false); if (FEED.available) return; }
  META = { ok:false, demo:false, loading:false, error:{ code:"no_mcp" }, stamp:null, source:"" }; renderAll();
})();
</script>

if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
